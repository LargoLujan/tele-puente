name: Agenda de Zaragoza

# Cada hora, de 6 a 23 (hora de Madrid, aprox.), deja la agenda de hoy en agenda/hoy.json
on:
  schedule:
    - cron: "5 4-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar la agenda de hoy
        run: python agenda/actualizar.py
      - name: Guardar si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda/hoy.json
          git diff --cached --quiet || (git commit -m "Agenda de Zaragoza del $(TZ=Europe/Madrid date +%d-%m-%Y)" && git push)
